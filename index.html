<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 24px 0 24px 210px;
      font-family: sans-serif;
      color: #222;
    }

    #menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 190px;
      height: 100vh;
      padding: 20px 14px;
      overflow-y: auto;
      background: #f2f2f2;
      border-right: 1px solid #ddd;
    }

    #menu a {
      display: block;
      margin-bottom: 10px;
      color: #222;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    #menu a:hover {
      text-decoration: underline;
    }

    main {
      width: 990px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 36px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
      scroll-margin-top: 16px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(6, 150px);
      gap: 18px;
    }

    .tarjeta {
      display: block;
      width: 150px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .tarjeta img {
      display: block;
      width: 150px;
      height: 215px;
      object-fit: contain;
      background: #f2f2f2;
    }

    .nombre {
      display: block;
      padding-top: 6px;
      font-size: 12px;
      line-height: 1.3;
    }

    @media (max-width: 700px) {
      body {
        padding-left: 150px;
      }

      #menu {
        width: 140px;
      }

      main {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <nav id="menu" aria-label="Navegación de galerías"></nav>
  <main id="galerias"></main>

  <script>
    const extensiones = [
      ".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp"
    ];

    const cantidadesEsperadas = {
      CaperucitaFeroz: 173,
      SenoritaAnaBitono: 90,
      SenoritaAnaColor: 90
    };

    function ruta(...partes) {
      return partes
        .map(parte => encodeURIComponent(parte))
        .join("/");
    }

function nombreLegible(nombre) {
  return nombre
    .replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, "$1 $2")
    .replace(/\bSenorita\b/g, "Señorita");
}


    async function buscarOriginal(carpeta, nombre) {
      for (const extension of extensiones) {
        const url = ruta(carpeta, nombre + extension);

        try {
          const respuesta = await fetch(url, { method: "HEAD" });
          if (respuesta.ok) {
            return url;
          }
        } catch {
          // Prueba la siguiente extensión.
        }
      }

      return null;
    }

    async function cargarGaleria() {
      const respuesta = await fetch("./listado_fotos.json");

      if (!respuesta.ok) {
        throw new Error("No se pudo cargar listado_fotos.json");
      }

      const listado = await respuesta.json();
      const contenedor = document.getElementById("galerias");
      const menu = document.getElementById("menu");

      let numeroGaleria = 0;

      for (const [carpeta, fotos] of Object.entries(listado)) {
        const id = carpeta;
        const textoCarpeta = nombreLegible(carpeta);

        const seccion = document.createElement("section");
        const titulo = document.createElement("h1");
        const galeria = document.createElement("div");

        titulo.id = id;

        galeria.className = "galeria";
        const cantidadEsperada = cantidadesEsperadas[carpeta];
if (cantidadEsperada !== undefined) {
  const faltan = Math.max(0, cantidadEsperada - fotos.length);
  titulo.textContent = `${textoCarpeta} (faltan ${faltan})`;
} else {
  titulo.textContent = textoCarpeta;
}
        const enlaceMenu = document.createElement("a");
        enlaceMenu.href = `#${id}`;
        enlaceMenu.textContent = textoCarpeta;
        menu.append(enlaceMenu);

        seccion.append(titulo, galeria);
        contenedor.append(seccion);

        for (const nombre of fotos) {
          const tarjeta = document.createElement("a");
          const imagen = document.createElement("img");
          const texto = document.createElement("span");

          tarjeta.className = "tarjeta";
          tarjeta.target = "_blank";
          tarjeta.rel = "noopener noreferrer";

          imagen.src = ruta(
            carpeta,
            "thumbnails",
            nombre + ".thumbnail.jpg"
          );
          imagen.alt = nombre;

          texto.className = "nombre";
          texto.textContent = nombre;

          tarjeta.append(imagen, texto);
          galeria.append(tarjeta);

          buscarOriginal(carpeta, nombre).then(url => {
            if (url) {
              tarjeta.href = url;
            } else {
              tarjeta.removeAttribute("href");
            }
          });
        }
      }
    }

    cargarGaleria().catch(error => {
      document.getElementById("galerias").textContent = error.message;
    });
  </script>
</body>
</html>
